# Example configuration for auth-dns.
#
# The TSIG secret below is PUBLIC (it is the test key used by the
# integration tests).  Generate a real one with:
#   head -c 32 /dev/urandom | base64
# and a DNSSEC key with:
#   openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out keys/example.com.pem

options {
    listen 127.0.0.1 port 15353;
    directory "examples";
    max-udp-size 1232;
};

key "xfr.example.com" {
    algorithm hmac-sha256;
    secret "c2VjcmV0MTIzNDU2Nzg5MA==";
};

zone "example.com" {
    type primary;
    file "example.com.zone";
    journal "example.com.jnl";
    allow-transfer { key "xfr.example.com"; };
    # Test-only key; never use this in production.
    dnssec-key "../testdata/test-ecdsa.pem";
    dnssec-flags 257;
};
